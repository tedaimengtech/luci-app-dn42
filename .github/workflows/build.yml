name: Build OpenWrt package

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore: [README.md]

permissions:
  contents: write

concurrency:
  group: openwrt-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Restore SDKs, feeds and build tools
        uses: actions/cache@v4
        with:
          path: .cache/openwrt-ci
          # Bump to refresh SDKs and feeds. Package source is replaced every run.
          key: openwrt-package-sdk-${{ runner.os }}-${{ runner.arch }}-ubuntu-24.04-24.10.4-25.12.6-v3

      - name: Build IPK and APK (package only)
        id: build
        run: bash scripts/ci-build.sh

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-dn42-${{ steps.build.outputs.tag }}
          path: artifacts/*
          if-no-files-found: error

      - name: Publish time-based release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.build.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" artifacts/* \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --generate-notes
